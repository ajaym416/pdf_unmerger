services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./tmp:/tmp
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

  worker:
    build: .
    command: celery -A app.worker.tasks worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./tmp:/tmp
    working_dir: /app

  redis:
    image: redis:alpine

  minio:
    image: minio/minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: server /data
    ports:
      - "9555:9000"
    volumes:
      - ./minio-data:/data

  frontend:
    build:
      context: ./pdf-unmerger-frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - web

